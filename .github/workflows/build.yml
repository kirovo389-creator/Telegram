name: Telega Beta Android build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telega-beta-build
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-branch}" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
            app_version_name="$GITHUB_REF_NAME"
          else
            release_tag="telega-v2-build-${GITHUB_RUN_NUMBER}"
            app_version_name="$release_tag"
          fi
          base_version_code=$((7274 + GITHUB_RUN_NUMBER))
          final_version_code=$((base_version_code * 10 + 9))
          {
            echo "TELEGA_RELEASE_TAG=$release_tag"
            echo "TELEGA_VERSION_NAME=$app_version_name"
            echo "TELEGA_BASE_VERSION_CODE=$base_version_code"
            echo "TELEGA_FINAL_VERSION_CODE=$final_version_code"
          } >> "$GITHUB_ENV"
          echo "Release tag: $release_tag"
          echo "Version name: $app_version_name"
          echo "Expected APK version code: $final_version_code"

          # Build the in-app changelog from commits since the previous Telega release tag.
          last_release_tag="$(git tag --list 'telega-v2-build-*' --sort=-creatordate | head -n 1)"
          if [[ -n "$last_release_tag" ]]; then
            git log --no-merges --format='• %s' "$last_release_tag..HEAD" | sed -E -e '/^• (Import upstream source and configure Telega|ci:|test:|build:|docs:|chore:)/d' -e 's/^• (feat|feature)(\([^)]*\))?:[[:space:]]*/+Добавлено: /' -e 's/^• (fix|bugfix)(\([^)]*\))?:[[:space:]]*/± Исправлено: /' -e 's/^• (remove|delete)(\([^)]*\))?:[[:space:]]*/- Удалено: /' -e 's/^• (refactor|perf)(\([^)]*\))?:[[:space:]]*/± Улучшено: /' -e 's/^• fix:/± Исправлено: /' -e 's/^• feat:/+Добавлено: /' -e 's/^• remove:/- Удалено: /' -e 's/^• /± Изменено: /' > /tmp/telega-changelog.txt
          else
            git log --no-merges --format='• %s' -n 8 HEAD | sed -E -e '/^• (Import upstream source and configure Telega|ci:|test:|build:|docs:|chore:)/d' -e 's/^• (feat|feature)(\([^)]*\))?:[[:space:]]*/+Добавлено: /' -e 's/^• (fix|bugfix)(\([^)]*\))?:[[:space:]]*/± Исправлено: /' -e 's/^• (remove|delete)(\([^)]*\))?:[[:space:]]*/- Удалено: /' -e 's/^• (refactor|perf)(\([^)]*\))?:[[:space:]]*/± Улучшено: /' -e 's/^• fix:/± Исправлено: /' -e 's/^• feat:/+Добавлено: /' -e 's/^• remove:/- Удалено: /' -e 's/^• /± Изменено: /' > /tmp/telega-changelog.txt
          fi
          if [[ ! -s /tmp/telega-changelog.txt ]]; then
            echo "• В этой сборке нет пользовательских изменений; выполнены внутренние улучшения сборки." > /tmp/telega-changelog.txt
          fi

      - name: Prepare committed Telega source without source-generation patches
        shell: bash
        run: |
          set -euo pipefail
          # All Telega features live in committed source files. Do not fetch upstream over them
          # or rewrite Java sources with Python patch scripts during a release build.
          sed -i "s/^APP_PACKAGE=.*/APP_PACKAGE=org.telega.messenger/" gradle.properties
          sed -i "s/^APP_VERSION_CODE=.*/APP_VERSION_CODE=${TELEGA_BASE_VERSION_CODE}/" gradle.properties
          sed -i "s/^APP_VERSION_NAME=.*/APP_VERSION_NAME=${TELEGA_VERSION_NAME}/" gradle.properties
          mkdir -p TMessagesProj/src/main/assets
          cp /tmp/telega-changelog.txt TMessagesProj/src/main/assets/telega_changelog.txt
          if [ -f TMessagesProj_App/google-services.json ]; then
            sed -i 's/org\.telegram\.messenger/org.telega.messenger/g' TMessagesProj_App/google-services.json
          fi

          test -f TMessagesProj/src/main/java/org/telegram/messenger/TelegaDeletedMessages.java
          test -f TMessagesProj/src/main/java/org/telegram/messenger/TelegaFeatures.java
          test -f TMessagesProj/src/main/java/org/telegram/messenger/TelegaCustomEmoji.java
          test -f TMessagesProj/src/main/java/org/telegram/messenger/TelegaSyncFirebase.java
          test -f TMessagesProj/src/main/assets/telega-sync-google-services.json
          grep -q 'TelegaDeletedMessages.mark' TMessagesProj/src/main/java/org/telegram/messenger/MessagesController.java
          grep -q 'TelegaDeletedMessages.isDeleted' TMessagesProj/src/main/java/org/telegram/ui/Cells/ChatMessageCell.java
          grep -q 'telegaTimeX' TMessagesProj/src/main/java/org/telegram/ui/Cells/ChatMessageCell.java
          grep -q 'applyTelegaEditHistory(messageText)' TMessagesProj/src/main/java/org/telegram/messenger/MessageObject.java
          grep -q 'TelegaSyncFirebase.initialize(this)' TMessagesProj/src/main/java/org/telegram/messenger/ApplicationLoader.java
          grep -q 'TelegaProfileSync.saveProfileStyle' TMessagesProj/src/main/java/org/telegram/ui/PeerColorActivity.java
          echo "Committed Telega sources validated; build will not import upstream or run source patch scripts."

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.TELEGA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.TELEGA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.TELEGA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.TELEGA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            test -n "${KEYSTORE_PASSWORD:-}"
            test -n "${KEY_ALIAS:-}"
            test -n "${KEY_PASSWORD:-}"
            echo "$KEYSTORE_BASE64" | base64 --decode > TMessagesProj/config/release.keystore
            echo "Stable release keystore loaded from Actions secrets."
          else
            echo "::warning::No stable signing secrets configured; using the repository's configured Gradle signing key. OTA update compatibility depends on that key remaining unchanged."
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true

          # SDK downloads can occasionally be truncated on hosted runners. Retry
          # cleanly instead of failing the entire Android build on a corrupt NDK ZIP.
          for attempt in 1 2 3; do
            if sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"; then
              exit 0
            fi
            echo "::warning::Android SDK/NDK installation failed (attempt $attempt/3); clearing incomplete package downloads."
            rm -rf "$ANDROID_HOME/ndk/27.2.12479018" "$ANDROID_HOME/.temp" "$HOME/.android/cache"
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          echo "::error::Android SDK/NDK installation failed after 3 attempts."
          exit 1

      - name: Initialize source submodules
        run: git submodule update --init --recursive --depth=1

      - name: Build stable Telega Beta APK (R8 and resource shrinking disabled)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.TELEGA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.TELEGA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.TELEGA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.TELEGA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace \
              -PRELEASE_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
              -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
              -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD"
          else
            ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace
          fi

      - name: Prepare APK and release notes
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find TMessagesProj_App/build/outputs -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p release-assets
          cp "$APK" release-assets/Telega-Beta.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose release-assets/Telega-Beta.apk
          {
            echo "Automated Telega Beta build from upstream Android source."
            echo ""
            echo "- Version: $TELEGA_VERSION_NAME"
            echo "- GitHub Actions run: $GITHUB_RUN_NUMBER"
            echo "- Supported native ABIs: arm64-v8a, armeabi-v7a"
            echo "- Build configuration: afatDebug, R8 minification and resource shrinking disabled"
            echo ""
            echo "Changes in this update:"
            cat /tmp/telega-changelog.txt
            echo ""
            echo "Telega-Version-Code: $TELEGA_FINAL_VERSION_CODE"
          } > release-notes.md
          echo "APK prepared and signature verified: release-assets/Telega-Beta.apk"
          stat -c "APK size: %s bytes" release-assets/Telega-Beta.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TELEGA_RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$TELEGA_RELEASE_TAG" release-assets/*.apk --clobber
            gh release edit "$TELEGA_RELEASE_TAG" --title "Telega Beta $TELEGA_VERSION_NAME" --notes-file release-notes.md
          else
            gh release create "$TELEGA_RELEASE_TAG" release-assets/*.apk \
              --title "Telega Beta $TELEGA_VERSION_NAME" \
              --notes-file release-notes.md
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telega-Beta-apk
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 30
