name: Telega Beta Android build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telega-beta-build
  cancel-in-progress: true

jobs:
  build-release:
    if: false # Temporarily disabled while source fixes are being completed.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-branch}" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
            app_version_name="$GITHUB_REF_NAME"
          else
            release_tag="telega-v2-build-${GITHUB_RUN_NUMBER}"
            app_version_name="$release_tag"
          fi
          base_version_code=$((7274 + GITHUB_RUN_NUMBER))
          final_version_code=$((base_version_code * 10 + 9))
          {
            echo "TELEGA_RELEASE_TAG=$release_tag"
            echo "TELEGA_VERSION_NAME=$app_version_name"
            echo "TELEGA_BASE_VERSION_CODE=$base_version_code"
            echo "TELEGA_FINAL_VERSION_CODE=$final_version_code"
          } >> "$GITHUB_ENV"
          echo "Release tag: $release_tag"
          echo "Version name: $app_version_name"
          echo "Expected APK version code: $final_version_code"

          # Build the in-app changelog from commits since the previous Telega release tag.
          last_release_tag="$(git tag --list 'telega-v2-build-*' --sort=-creatordate | head -n 1)"
          if [[ -n "$last_release_tag" ]]; then
            git log --no-merges --format='• %s' "$last_release_tag..HEAD" | sed -e '/^• Import upstream source and configure Telega/d' -e '/^• ci:/d' -e '/^• test:/d' -e '/^• build:/d' -e '/^• docs:/d' -e '/^• chore:/d' > /tmp/telega-changelog.txt
          else
            git log --no-merges --format='• %s' -n 8 HEAD | sed -e '/^• Import upstream source and configure Telega/d' -e '/^• ci:/d' -e '/^• test:/d' -e '/^• build:/d' -e '/^• docs:/d' -e '/^• chore:/d' > /tmp/telega-changelog.txt
          fi
          if [[ ! -s /tmp/telega-changelog.txt ]]; then
            echo "• В этой сборке нет пользовательских изменений; выполнены внутренние улучшения сборки." > /tmp/telega-changelog.txt
          fi

      - name: Import upstream Android source and apply Telega patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/telega-preserve
          git fetch origin main
          git reset --hard origin/main
          cp -a .github /tmp/telega-preserve/github
          cp README.md /tmp/telega-preserve/README.md
          cp TMessagesProj/src/main/java/org/telegram/messenger/TelegaBadgeSync.java /tmp/telega-preserve/TelegaBadgeSync.java
          cp TMessagesProj/src/main/java/org/telegram/ui/LaunchActivity.java /tmp/telega-preserve/LaunchActivity.java
          cp TMessagesProj/src/main/java/org/telegram/ui/TelegaSettingsActivity.java /tmp/telega-preserve/TelegaSettingsActivity.java
          cp TMessagesProj/src/main/java/org/telegram/messenger/TelegaOtaUpdater.java /tmp/telega-preserve/TelegaOtaUpdater.java
          cp TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java /tmp/telega-preserve/ProfileActivity.java
          cp TMessagesProj/src/main/java/org/telegram/ui/Cells/ChatMessageCell.java /tmp/telega-preserve/ChatMessageCell.java
          cp TMessagesProj/src/main/java/org/telegram/messenger/MessageObject.java /tmp/telega-preserve/MessageObject.java
          cp TMessagesProj/src/main/java/org/telegram/messenger/PushListenerController.java /tmp/telega-preserve/PushListenerController.java
          cp TMessagesProj/src/main/java/org/telegram/messenger/TelegaInstallReceiver.java /tmp/telega-preserve/TelegaInstallReceiver.java
          cp /tmp/telega-changelog.txt /tmp/telega-preserve/telega_changelog.txt
          git fetch --depth=1 https://github.com/DrKLO/Telegram.git master
          git read-tree --reset FETCH_HEAD
          git checkout-index --all --force
          git clean -fdx
          rm -rf .github
          cp -a /tmp/telega-preserve/github .github
          cp /tmp/telega-preserve/README.md README.md
          mkdir -p .github/patches .github/workflows
          sed -i "s/^APP_PACKAGE=.*/APP_PACKAGE=org.telega.messenger/" gradle.properties
          sed -i "s/^APP_VERSION_CODE=.*/APP_VERSION_CODE=${TELEGA_BASE_VERSION_CODE}/" gradle.properties
          sed -i "s/^APP_VERSION_NAME=.*/APP_VERSION_NAME=${TELEGA_VERSION_NAME}/" gradle.properties

          patches=(
            .github/patches/retain_deleted_messages.py
            .github/patches/telega_local_premium.py
            .github/patches/telega_shared_status.py
            .github/patches/telega_custom_emoji.py
            .github/patches/telega_profile_style.py
            .github/patches/telega_profile_style_fix.py
            .github/patches/telega_local_gifts.py
            .github/patches/telega_channel_prompt.py
            .github/patches/telega_features.py
            .github/patches/telega_ota.py
            .github/patches/telega_badge.py
            .github/patches/telega_advanced_fixes.py
            .github/patches/telega_ota_hardening.py
            .github/patches/telega_build_config.py
            .github/patches/telega_plus_features.py
          )
          for patch in "${patches[@]}"; do
            test -f "$patch"
            python3 "$patch"
          done

          # Keep the committed TelegaBadgeSync implementation; upstream does not contain it.
          cp /tmp/telega-preserve/TelegaBadgeSync.java TMessagesProj/src/main/java/org/telegram/messenger/TelegaBadgeSync.java
          # Keep direct GitHub source edits after the upstream source import.
          cp /tmp/telega-preserve/LaunchActivity.java TMessagesProj/src/main/java/org/telegram/ui/LaunchActivity.java
          cp /tmp/telega-preserve/TelegaSettingsActivity.java TMessagesProj/src/main/java/org/telegram/ui/TelegaSettingsActivity.java
          cp /tmp/telega-preserve/TelegaOtaUpdater.java TMessagesProj/src/main/java/org/telegram/messenger/TelegaOtaUpdater.java
          cp /tmp/telega-preserve/ProfileActivity.java TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java
          cp /tmp/telega-preserve/ChatMessageCell.java TMessagesProj/src/main/java/org/telegram/ui/Cells/ChatMessageCell.java
          cp /tmp/telega-preserve/MessageObject.java TMessagesProj/src/main/java/org/telegram/messenger/MessageObject.java
          cp /tmp/telega-preserve/PushListenerController.java TMessagesProj/src/main/java/org/telegram/messenger/PushListenerController.java
          cp /tmp/telega-preserve/TelegaInstallReceiver.java TMessagesProj/src/main/java/org/telegram/messenger/TelegaInstallReceiver.java
          # Apply visible Telega branding after restoring directly edited source files.
          python3 .github/patches/telega_branding.py
          mkdir -p TMessagesProj/src/main/assets
          cp /tmp/telega-preserve/telega_changelog.txt TMessagesProj/src/main/assets/telega_changelog.txt

          python3 - <<'PY'
          import ast
          import glob
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for path in glob.glob(".github/patches/*.py"):
              ast.parse(Path(path).read_text(encoding="utf-8"), filename=path)
          for path in glob.glob("TMessagesProj/src/main/res/values*/strings.xml"):
              ET.parse(path)
          ET.parse("TMessagesProj/src/main/AndroidManifest.xml")
          launch = Path("TMessagesProj/src/main/java/org/telegram/ui/LaunchActivity.java").read_text(encoding="utf-8")
          ota = Path("TMessagesProj/src/main/java/org/telegram/messenger/TelegaOtaUpdater.java").read_text(encoding="utf-8")
          settings = Path("TMessagesProj/src/main/java/org/telegram/ui/TelegaSettingsActivity.java").read_text(encoding="utf-8")
          app_gradle = Path("TMessagesProj_App/build.gradle").read_text(encoding="utf-8")
          entry_view = Path("TMessagesProj/src/main/java/org/telegram/ui/Components/ChatActivityEnterView.java").read_text(encoding="utf-8")
          peer_color = Path("TMessagesProj/src/main/java/org/telegram/ui/PeerColorActivity.java").read_text(encoding="utf-8")
          profile = Path("TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java").read_text(encoding="utf-8")
          assert launch.count("TelegaOtaUpdater.check(this)") == 1, "OTA check must be wired exactly once"
          assert "releases/latest" in ota, "OTA must query the latest stable GitHub Release"
          assert "return (versionBase + run) * 10L + 9L;" in ota, "OTA versionCode must match the ABI-aware APK versionCode"
          assert "TelegaOtaUpdater.isEnabled(context)" in settings, "OTA toggle is missing"
          assert 'abiFilters "armeabi-v7a", "arm64-v8a"' in app_gradle, "release ABI filters were not narrowed"
          assert "messageEditText.setSelection(i + inserted.length(), i + inserted.length())" in entry_view, "premium emoji Unicode metadata must remain attached after typing"
          assert "TL_users_getFullUser loadFull = new TLRPC.TL_users_getFullUser();" in peer_color, "profile style sync must load user info when cache is empty"
          assert "syncTelegaProfileStyleMetadata(fetchedFull, telegaPendingColor, telegaPendingEmoji);" in peer_color, "profile style sync fallback is missing"
          assert "private int telegaClosestPeerColorId(int accentColor, int pageType)" in peer_color, "collectible accent color mapper is missing"
          assert "import org.telegram.ui.ActionBar.AlertDialog;" in ota, "OTA prompt must use Telegram-themed dialogs"
          assert "progress.setMessage(\"Скачивание новой версии…\");" in ota, "OTA progress copy must not expose GitHub"
          assert '.setPositiveButton("Обновить",' in ota and '.setNegativeButton("Позже",' in ota, "OTA actions are missing"
          assert "Загрузка APK из GitHub Releases…" not in ota, "provider-specific text remains in the OTA progress UI"
          assert "android.permission.REQUEST_INSTALL_PACKAGES" in Path("TMessagesProj/src/main/AndroidManifest.xml").read_text(encoding="utf-8"), "unknown-source install permission is missing"
          assert "TelegaInstallReceiver" in Path("TMessagesProj/src/main/AndroidManifest.xml").read_text(encoding="utf-8"), "PackageInstaller result receiver is missing"
          dialog_cell = Path("TMessagesProj/src/main/java/org/telegram/ui/Cells/DialogCell.java").read_text(encoding="utf-8")
          message_cell = Path("TMessagesProj/src/main/java/org/telegram/ui/Cells/ChatMessageCell.java").read_text(encoding="utf-8")
          message_object = Path("TMessagesProj/src/main/java/org/telegram/messenger/MessageObject.java").read_text(encoding="utf-8")
          push_controller = Path("TMessagesProj/src/main/java/org/telegram/messenger/PushListenerController.java").read_text(encoding="utf-8")
          install_receiver = Path("TMessagesProj/src/main/java/org/telegram/messenger/TelegaInstallReceiver.java").read_text(encoding="utf-8")
          download_queue = Path("TMessagesProj/src/main/java/org/telegram/messenger/FileLoaderPriorityQueue.java").read_text(encoding="utf-8")
          assert "TelegaBadgeRendering.decorateDialogName" in dialog_cell, "shared badge/status row rendering is missing"
          assert "TelegaMessageEffects.onMessageBound(this," in message_cell, "message effect hook is missing"
          assert "Telega turbo downloads" in download_queue, "turbo download queue toggle is not wired"
          assert "applyTelegaEditHistory(messageText)" in message_object, "edited-message previous-text display is missing"
          assert "scheduleTokenRetry()" in push_controller, "Firebase push registration retry is missing"
          assert "archiveVersion <= installedVersion" in ota and "params.setSize(file.length())" in ota, "OTA APK validation/session sizing is missing"
          assert "clearPendingUpdate(context);" in install_receiver, "OTA APK cleanup after installer result is missing"
          assert 'addToggle(context, list, "Auto Proxy"' not in settings, "Auto Proxy toggle must remain removed"
          assert "Стеклянные чаты" not in settings, "Glass chats toggle must remain removed"
          assert "TelegaLocalStatus.updateBio(" in Path("TMessagesProj/src/main/java/org/telegram/ui/ChangeBioActivity.java").read_text(encoding="utf-8"), "BIO metadata would be lost while editing the profile"
          assert "readTelegaChangelog()" in launch and "telega_changelog.txt" in launch, "in-app changelog must use this build's generated notes"
          assert "Не удалось открыть системный установщик" not in ota, "confusing installer toast must stay removed"
          assert 'getSharedPreferences("telega_local_status"' in profile, "local emoji status fallback is missing"
          assert "telegaTimeX" in message_cell, "deleted-message trash marker must be positioned relative to the timestamp"
          assert "ПРОИЗВОДИТЕЛЬНОСТЬ" in settings, "grouped Telega settings UI is missing"
          assert Path("TMessagesProj/src/main/assets/telega_changelog.txt").is_file(), "per-build changelog asset is missing"
          print("Patch syntax, Android XML, Telega branding, edit-history display, Firebase push retry, OTA package validation/cleanup, Unicode emoji cursor, shared profile sync/color mapper, installer permission, badge/status transport, message effects, turbo downloads and release ABI configuration validated.")
          PY

          sed -i 's/<string name="AppName">Telegram<\/string>/<string name="AppName">Telega<\/string>/' TMessagesProj/src/main/res/values/strings.xml
          sed -i 's/<string name="AppNameBeta">Telegram Beta<\/string>/<string name="AppNameBeta">Telega Beta<\/string>/' TMessagesProj/src/main/res/values/strings.xml
          if [ -f TMessagesProj_App/google-services.json ]; then
            sed -i 's/org\.telegram\.messenger/org.telega.messenger/g' TMessagesProj_App/google-services.json
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import upstream source and configure Telega [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.TELEGA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.TELEGA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.TELEGA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.TELEGA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            test -n "${KEYSTORE_PASSWORD:-}"
            test -n "${KEY_ALIAS:-}"
            test -n "${KEY_PASSWORD:-}"
            echo "$KEYSTORE_BASE64" | base64 --decode > TMessagesProj/config/release.keystore
            echo "Stable release keystore loaded from Actions secrets."
          else
            echo "::warning::No stable signing secrets configured; using the repository's configured Gradle signing key. OTA update compatibility depends on that key remaining unchanged."
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true

          # SDK downloads can occasionally be truncated on hosted runners. Retry
          # cleanly instead of failing the entire Android build on a corrupt NDK ZIP.
          for attempt in 1 2 3; do
            if sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"; then
              exit 0
            fi
            echo "::warning::Android SDK/NDK installation failed (attempt $attempt/3); clearing incomplete package downloads."
            rm -rf "$ANDROID_HOME/ndk/27.2.12479018" "$ANDROID_HOME/.temp" "$HOME/.android/cache"
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          echo "::error::Android SDK/NDK installation failed after 3 attempts."
          exit 1

      - name: Initialize source submodules
        run: git submodule update --init --recursive --depth=1

      - name: Build stable Telega Beta APK (R8 and resource shrinking disabled)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.TELEGA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.TELEGA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.TELEGA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.TELEGA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace \
              -PRELEASE_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
              -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
              -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD"
          else
            ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace
          fi

      - name: Prepare APK and release notes
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find TMessagesProj_App/build/outputs -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p release-assets
          cp "$APK" release-assets/Telega-Beta.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose release-assets/Telega-Beta.apk
          {
            echo "Automated Telega Beta build from upstream Android source."
            echo ""
            echo "- Version: $TELEGA_VERSION_NAME"
            echo "- GitHub Actions run: $GITHUB_RUN_NUMBER"
            echo "- Supported native ABIs: arm64-v8a, armeabi-v7a"
            echo "- Build configuration: afatDebug, R8 minification and resource shrinking disabled"
            echo ""
            echo "Changes in this update:"
            cat /tmp/telega-changelog.txt
            echo ""
            echo "Telega-Version-Code: $TELEGA_FINAL_VERSION_CODE"
          } > release-notes.md
          echo "APK prepared and signature verified: release-assets/Telega-Beta.apk"
          stat -c "APK size: %s bytes" release-assets/Telega-Beta.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TELEGA_RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$TELEGA_RELEASE_TAG" release-assets/*.apk --clobber
            gh release edit "$TELEGA_RELEASE_TAG" --title "Telega Beta $TELEGA_VERSION_NAME" --notes-file release-notes.md
          else
            gh release create "$TELEGA_RELEASE_TAG" release-assets/*.apk \
              --title "Telega Beta $TELEGA_VERSION_NAME" \
              --notes-file release-notes.md
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telega-Beta-apk
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 30
