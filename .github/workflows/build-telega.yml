name: Telega Android build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-telega.yml"
      - "README.md"
      - ".github/patches/**"

permissions:
  contents: write

concurrency:
  group: telega-android-build
  cancel-in-progress: true

jobs:
  sync-build-release:
    if: ${{ startsWith(github.event.head_commit.message, 'BUILD Telega FINAL') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Telega repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream source and apply Telega defaults
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          cp README.md /tmp/telega-readme.md
          cp .github/workflows/build-telega.yml /tmp/build-telega.yml
          cp .github/patches/retain_deleted_messages.py /tmp/retain_deleted_messages.py
          cp .github/patches/telega_local_premium.py /tmp/telega_local_premium.py
          cp .github/patches/telega_shared_status.py /tmp/telega_shared_status.py
          cp .github/patches/telega_custom_emoji.py /tmp/telega_custom_emoji.py
          cp .github/patches/telega_profile_style.py /tmp/telega_profile_style.py
          cp .github/patches/telega_profile_style_fix.py /tmp/telega_profile_style_fix.py
          cp .github/patches/telega_local_gifts.py /tmp/telega_local_gifts.py
          cp .github/patches/telega_channel_prompt.py /tmp/telega_channel_prompt.py
          cp .github/patches/telega_branding.py /tmp/telega_branding.py
          cp .github/patches/telega_features.py /tmp/telega_features.py
          cp .github/patches/telega_ota.py /tmp/telega_ota.py
          cp .github/patches/telega_badge.py /tmp/telega_badge.py
          cp .github/patches/telega_advanced_fixes.py /tmp/telega_advanced_fixes.py
          git fetch --depth=1 https://github.com/DrKLO/Telegram.git master
          git read-tree --reset -u FETCH_HEAD
          mkdir -p .github/workflows .github/patches
          cp /tmp/telega-readme.md README.md
          cp /tmp/build-telega.yml .github/workflows/build-telega.yml
          cp /tmp/retain_deleted_messages.py .github/patches/retain_deleted_messages.py
          cp /tmp/telega_local_premium.py .github/patches/telega_local_premium.py
          cp /tmp/telega_shared_status.py .github/patches/telega_shared_status.py
          cp /tmp/telega_custom_emoji.py .github/patches/telega_custom_emoji.py
          cp /tmp/telega_profile_style.py .github/patches/telega_profile_style.py
          cp /tmp/telega_profile_style_fix.py .github/patches/telega_profile_style_fix.py
          cp /tmp/telega_local_gifts.py .github/patches/telega_local_gifts.py
          cp /tmp/telega_channel_prompt.py .github/patches/telega_channel_prompt.py
          cp /tmp/telega_branding.py .github/patches/telega_branding.py
          cp /tmp/telega_features.py .github/patches/telega_features.py
          cp /tmp/telega_ota.py .github/patches/telega_ota.py
          cp /tmp/telega_badge.py .github/patches/telega_badge.py
          cp /tmp/telega_advanced_fixes.py .github/patches/telega_advanced_fixes.py
          sed -i 's/^APP_PACKAGE=.*/APP_PACKAGE=org.telega.messenger/' gradle.properties
          sed -i "s/^APP_VERSION_CODE=.*/APP_VERSION_CODE=$((7175 + GITHUB_RUN_NUMBER))/" gradle.properties
          sed -i 's/<string name="AppName">Telegram<\/string>/<string name="AppName">Telega<\/string>/' TMessagesProj/src/main/res/values/strings.xml
          sed -i 's/<string name="AppNameBeta">Telegram Beta<\/string>/<string name="AppNameBeta">Telega Beta<\/string>/' TMessagesProj/src/main/res/values/strings.xml
          if [ -f TMessagesProj_App/google-services.json ]; then
            sed -i 's/org\.telegram\.messenger/org.telega.messenger/g' TMessagesProj_App/google-services.json
          fi
          python3 .github/patches/retain_deleted_messages.py
          python3 .github/patches/telega_local_premium.py
          python3 .github/patches/telega_shared_status.py
          python3 .github/patches/telega_custom_emoji.py
          python3 .github/patches/telega_profile_style.py
          python3 .github/patches/telega_profile_style_fix.py
          python3 .github/patches/telega_local_gifts.py
          python3 .github/patches/telega_channel_prompt.py
          python3 .github/patches/telega_branding.py
          python3 .github/patches/telega_features.py
          python3 .github/patches/telega_ota.py
          python3 .github/patches/telega_badge.py
          python3 .github/patches/telega_advanced_fixes.py
          set -euo pipefail
          grep -q 'TelegaOtaUpdater.check(this)' TMessagesProj/src/main/java/org/telegram/ui/LaunchActivity.java
          grep -q 'TelegaOtaUpdater.installPending(this)' TMessagesProj/src/main/java/org/telegram/ui/LaunchActivity.java
          grep -q 'REQUEST_INSTALL_PACKAGES' TMessagesProj/src/main/AndroidManifest.xml
          grep -q 'class TelegaInstallReceiver' TMessagesProj/src/main/java/org/telegram/messenger/TelegaInstallReceiver.java
          grep -q 'TelegaFeatures.decodeArticle' TMessagesProj/src/main/java/org/telegram/messenger/MessageObject.java
          grep -q 'TelegaCustomEmoji.decode' TMessagesProj/src/main/java/org/telegram/messenger/MessageObject.java
          grep -q 'TELEGA_PREMIUM_STICKER_FALLBACK' TMessagesProj/src/main/java/org/telegram/messenger/SendMessagesHelper.java
          grep -q 'TelegaDeletedMessages.isDeleted' TMessagesProj/src/main/java/org/telegram/ui/Cells/ChatMessageCell.java
          grep -q 'onPeerAvailable(currentAccount' TMessagesProj/src/main/java/org/telegram/messenger/MessagesController.java
          grep -q 'TelegaBadgeDrawable' TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java
          grep -q 'Настройки Telega' TMessagesProj/src/main/java/org/telegram/ui/TelegaSettingsActivity.java
          grep -q 'Список: ' TMessagesProj/src/main/java/org/telegram/messenger/TelegaFeatures.java
          grep -q 'markAllUnreadReactionsAsRead' TMessagesProj/src/main/java/org/telegram/messenger/TelegaFeatures.java
          grep -q 'Auto Proxy' TMessagesProj/src/main/java/org/telegram/ui/TelegaSettingsActivity.java
          grep -q 'showTelegaChangelogIfNeeded' TMessagesProj/src/main/java/org/telegram/ui/LaunchActivity.java
          grep -q 'telegaFallbackEnterView' TMessagesProj/src/main/java/org/telegram/ui/iv/RichEditor.java
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          for path in glob.glob(".github/patches/*.py"):
              with open(path, encoding="utf-8") as source:
                  compile(source.read(), path, "exec")
          for path in glob.glob("TMessagesProj/src/main/res/values*/strings.xml"):
              ET.parse(path)
          print("Patch Python syntax and Android string XML validation passed.")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import upstream source and configure Telega [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Initialize source submodules
        run: git submodule update --init --recursive --depth=1

      - name: Build Telega debug APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find TMessagesProj_App/build/outputs -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p release-assets
          cp "$APK" release-assets/Telega-debug.apk

      - name: Sign APK with stable OTA key when configured
        shell: bash
        env:
          TELEGA_KEYSTORE_BASE64: ${{ secrets.TELEGA_KEYSTORE_BASE64 }}
          TELEGA_KEYSTORE_PASSWORD: ${{ secrets.TELEGA_KEYSTORE_PASSWORD }}
          TELEGA_KEY_ALIAS: ${{ secrets.TELEGA_KEY_ALIAS }}
          TELEGA_KEY_PASSWORD: ${{ secrets.TELEGA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${TELEGA_KEYSTORE_BASE64:-}" ]; then
            test -n "${TELEGA_KEYSTORE_PASSWORD:-}"
            test -n "${TELEGA_KEY_ALIAS:-}"
            test -n "${TELEGA_KEY_PASSWORD:-}"
            echo "$TELEGA_KEYSTORE_BASE64" | base64 --decode > /tmp/telega-release.jks
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
              --ks /tmp/telega-release.jks \
              --ks-key-alias "$TELEGA_KEY_ALIAS" \
              --ks-pass "pass:$TELEGA_KEYSTORE_PASSWORD" \
              --key-pass "pass:$TELEGA_KEY_PASSWORD" \
              --out release-assets/Telega-stable.apk \
              release-assets/Telega-debug.apk
            mv release-assets/Telega-stable.apk release-assets/Telega-debug.apk
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose release-assets/Telega-debug.apk
            echo "APK was signed using the configured persistent OTA key."
          else
            echo "::warning::Stable OTA signing key is not configured. The APK will use GitHub runner debug signing, so Android may reject in-place updates over an installed build."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telega-debug-apk
          path: release-assets/Telega-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: telega-build-${{ github.run_number }}
          name: Telega build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: release-assets/Telega-debug.apk
